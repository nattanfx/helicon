[package]
name = "helicon"
version = "0.12.5-pt5"
description = "Helicon: desktop ADE for the Muse Code CLI"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["webview-data-url"] }
tauri-plugin-process = "2"
# A webview does not reliably have the browser's Notification API, so the OS notifier comes from here.
tauri-plugin-notification = "2"
# Links in replies open in the default browser; the webview itself has nowhere to put them.
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
