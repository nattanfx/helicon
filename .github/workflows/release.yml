name: Release

on:
  push:
    tags: ["v*"]
  # Rebuilds an existing tag: `gh workflow run release.yml --ref vX.Y.Z`. It runs the workflow file as
  # it is at that tag. This fork publishes a draft; publishing the release is a separate decision.
  workflow_dispatch:

jobs:
  desktop-windows:
    permissions:
      contents: write
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - run: npm run build --workspace @helicon/daemon --workspace @helicon/ui --workspace @helicon/server
      # Pinned to a commit: a moved tag must not change what runs.
      - uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0.6.2
        env:
          # Which Node.js sidecar beforeBuildCommand bundles (apps/desktop/scripts/fetch-node.mjs).
          HELICON_NODE_TARGET: x86_64-pc-windows-msvc
          # Shown as Compilação when it is a git SHA. The app version comes from tauri.conf.json.
          HELICON_BUILD: ${{ github.sha }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Helicon ${{ github.ref_name }}"
          releaseBody: |
            Pacote pessoal deste fork para Windows. Não é o Helicon original e o aplicativo não se atualiza sozinho.

            A versão na interface é a de tauri.conf.json (0.12.5-pt5 neste pacote). Feche o Helicon antes de instalar. Faça backup das pastas de dados, como em docs/BACKUP.md, antes de atualizar a instalação normal. No instalador, não marque apagar os dados do aplicativo.

            Em relação à v0.12.4-pt4: credencial no servidor local; no máximo uma tentativa de título por conversa nova; navegação e silêncio de conversa; rótulos conhecidos em português; edição de Markdown recuperável sem gravar o original até salvar.

            Não inclui sandbox, YOLO nem contas do original. Não há instalador de macOS.
          releaseDraft: true
          prerelease: false
          retryAttempts: 3
          args: --target x86_64-pc-windows-msvc
