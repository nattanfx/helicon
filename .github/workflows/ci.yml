name: CI

on:
  push:
    branches: [prod]
  pull_request:

permissions:
  contents: read

jobs:
  node:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build --workspace @helicon/daemon --workspace @helicon/ui --workspace @helicon/server
      - run: npm run test --workspace @helicon/daemon --workspace @helicon/ui --workspace @helicon/server
      - run: npm run build --workspace @helicon/web
      - run: npm run test --workspace @helicon/web

  # The desktop crate is only otherwise compiled while cutting a release, which is far too late to
  # find out that it does not build.
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: stable
      - run: npm ci
      - run: npm run build --workspace @helicon/daemon --workspace @helicon/ui --workspace @helicon/server
      - run: npm run build --workspace @helicon/web
      # tauri-build checks every path in bundle.resources before it compiles anything, and those are
      # built rather than committed. This is what the release does through beforeBuildCommand.
      - run: npm run bundle:server --workspace helicon-desktop
      # bundle.externalBin is checked the same way, so fetch the Node.js sidecar too.
      - run: npm run fetch:node --workspace helicon-desktop
      # --locked: fail instead of quietly resolving crates differently from the committed Cargo.lock.
      - run: cargo check --locked --manifest-path apps/desktop/src-tauri/Cargo.toml
      - run: cargo test --locked --manifest-path apps/desktop/src-tauri/Cargo.toml
