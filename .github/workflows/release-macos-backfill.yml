name: Release macOS backfill

# One-off: attach macOS assets to releases that shipped Windows-only. Run once per tag; each run
# uploads into that tag's existing release without touching its name, body, or Windows assets.
# Only the newest release feeds the updater (releases/latest/download/latest.json), so after
# backfilling the newest tag, check its latest.json lists every platform.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to add macOS assets to (e.g. v0.9.0)"
        required: true
        type: string

jobs:
  desktop:
    permissions:
      contents: write
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          # universal-apple-darwin needs both halves installed; aarch64 is already the runner default.
          targets: x86_64-apple-darwin
      - run: npm ci
      - run: npm run build --workspace @helicon/daemon --workspace @helicon/ui --workspace @helicon/server
      # Pinned to a commit: this step holds the updater signing key, so a moved tag must not change what runs.
      - uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0.6.2
        env:
          # Which Node.js sidecar beforeBuildCommand bundles (apps/desktop/scripts/fetch-node.mjs).
          HELICON_NODE_TARGET: universal-apple-darwin
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signs the installer for the in-app updater, which also publishes latest.json.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ inputs.tag }}
          releaseDraft: false
          prerelease: false
          # Old tags predate the macOS bundle config, so the bundles are named here. One universal
          # binary for Apple Silicon and Intel.
          args: --target universal-apple-darwin --bundles app dmg
